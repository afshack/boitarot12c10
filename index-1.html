<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Huyền Bí Bot - Tarot, Cung hoàng đạo, Tử vi</title>
<style>
:root{--bg:#120e24;--card:#1d1736;--card2:#251d45;--text:#ece8fa;--muted:#9a93b8;--primary:#a78bfa;--gold:#f5c76b;--border:#34295a;--on:#120e24}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(1200px 600px at 50% -10%,#2a1f5a 0,var(--bg) 60%);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{height:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column}
header{padding:12px 16px;border-bottom:1px solid var(--border);background:rgba(29,23,54,.85);display:flex;justify-content:space-between;align-items:center}
header h1{font-size:17px;margin:0;color:var(--gold)}
header small{display:block;color:var(--muted);font-size:12px}
#home{border:1px solid var(--border);background:none;color:var(--muted);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px;display:none}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;padding:10px 14px;border-radius:16px;word-wrap:break-word;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--primary);color:var(--on);border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--card);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg b{color:var(--gold)}
.t{font-weight:700;color:var(--gold);margin-bottom:4px}
.st{margin:4px 0}
.mute{color:var(--muted);font-size:13.5px}
.opts{display:flex;flex-wrap:wrap;gap:8px;align-self:flex-start;max-width:96%}
.opt{border:1px solid var(--primary);background:var(--card);color:var(--primary);padding:7px 12px;border-radius:999px;cursor:pointer;font:inherit;font-size:14px}
.opt:hover{background:var(--primary);color:var(--on)}
.tc{display:inline-block;text-align:center;background:var(--card2);border:1px solid var(--gold);border-radius:12px;padding:10px 14px;margin:4px 6px 4px 0;min-width:130px}
.tc .sym{font-size:40px;line-height:1.1}
.tc .sym.rev{display:inline-block;transform:rotate(180deg)}
.tc .tn{font-weight:700;color:var(--gold)}
.tc .ten{font-size:12px;color:var(--muted)}
.stars{color:var(--gold);letter-spacing:2px}
.row{display:flex;justify-content:space-between;gap:10px}
#bar{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border);background:rgba(29,23,54,.9)}
#q{flex:1;border:1px solid var(--border);border-radius:12px;padding:10px 12px;font:inherit;background:var(--bg);color:var(--text)}
#q:focus{outline:2px solid var(--primary)}
#send{border:0;background:var(--primary);color:var(--on);border-radius:12px;padding:0 18px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <header>
    <div><h1>🔮 Huyền Bí Bot</h1><small>Cung hoàng đạo · Tarot · Tử vi · Thần số học · Giải mộng</small></div>
    <button id="home" type="button">↩ Menu</button>
  </header>
  <div id="log"></div>
  <form id="bar" autocomplete="off">
    <input id="q" type="text" maxlength="80" placeholder="Nhập tên của bạn...">
    <button id="send" type="submit">Bắt đầu</button>
  </form>
</div>
<script>
"use strict";
const $=id=>document.getElementById(id), log=$("log"), qIn=$("q"), sendBtn=$("send"), homeBtn=$("home");
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d");
const pad=x=>String(x).padStart(2,"0");
function scroll(){log.scrollTop=log.scrollHeight}
function bot(h){const d=document.createElement("div");d.className="msg bot";d.innerHTML=h;log.appendChild(d);scroll();return d}
function user(t){const d=document.createElement("div");d.className="msg user";d.textContent=t;log.appendChild(d);scroll()}
function opts(list){
  const w=document.createElement("div");w.className="opts";
  list.forEach(([label,fn])=>{const b=document.createElement("button");b.type="button";b.className="opt";b.textContent=label;b.onclick=()=>{w.remove();user(label);fn()};w.appendChild(b)});
  log.appendChild(w);scroll();
}
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function rng(seed){let a=seed>>>0;return()=>{a+=0x6D2B79F5;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
const stars=n=>"★".repeat(n)+"☆".repeat(5-n);
const NOTE="<div class='mute'>Nội dung mang tính giải trí và tham khảo, không thay thế lời khuyên y tế, tài chính hay pháp lí.</div>";

/* ---------- dữ liệu cung hoàng đạo ---------- */
const SIGNS=[
["Bạch Dương","♈","21/3 – 19/4","Lửa","Tiên phong","Sao Hỏa","Nhiệt huyết, thẳng thắn, thích dẫn đầu và dám bắt đầu việc mới. Đôi khi nóng vội và thiếu kiên nhẫn.","Yêu chân thành, chủ động, cần người đủ vững vàng để theo kịp nhịp của bạn.","Hợp vai trò khởi xướng, kinh doanh, thể thao, những việc cần quyết đoán nhanh."],
["Kim Ngưu","♉","20/4 – 20/5","Đất","Kiên định","Sao Kim","Vững vàng, thực tế, yêu cái đẹp và sự ổn định. Có thể bướng bỉnh và ngại thay đổi.","Chậm mà chắc, trung thành, coi trọng sự an toàn và những điều giản dị.","Hợp tài chính, ẩm thực, nghệ thuật, những công việc cần bền bỉ."],
["Song Tử","♊","21/5 – 20/6","Khí","Linh hoạt","Sao Thủy","Nhanh trí, hoạt ngôn, tò mò về mọi thứ. Dễ phân tán và hay thay đổi ý kiến.","Cần người trò chuyện cùng, thích sự mới mẻ và hài hước.","Hợp truyền thông, giảng dạy, viết lách, bán hàng."],
["Cự Giải","♋","21/6 – 22/7","Nước","Tiên phong","Mặt Trăng","Nhạy cảm, giàu tình thương, coi trọng gia đình. Dễ tổn thương và hay lo xa.","Chăm sóc tận tụy, cần cảm giác an toàn về mặt cảm xúc.","Hợp chăm sóc sức khỏe, giáo dục, ẩm thực, công việc cần sự thấu cảm."],
["Sư Tử","♌","23/7 – 22/8","Lửa","Kiên định","Mặt Trời","Tự tin, hào phóng, có sức hút và thích tỏa sáng. Có thể kiêu hãnh và cần được ghi nhận.","Yêu nồng nhiệt, rộng lượng, mong được trân trọng.","Hợp lãnh đạo, biểu diễn, sáng tạo, quản lí."],
["Xử Nữ","♍","23/8 – 22/9","Đất","Linh hoạt","Sao Thủy","Tỉ mỉ, chu đáo, phân tích tốt. Hay cầu toàn và tự phê bình.","Thể hiện tình cảm qua hành động nhỏ, cần người đáng tin cậy.","Hợp nghiên cứu, y tế, kế toán, biên tập, những việc cần độ chính xác."],
["Thiên Bình","♎","23/9 – 22/10","Khí","Tiên phong","Sao Kim","Hòa nhã, yêu công bằng và cái đẹp. Hay do dự khi phải lựa chọn.","Lãng mạn, coi trọng sự hài hòa và chia sẻ.","Hợp ngoại giao, luật, thiết kế, làm việc nhóm."],
["Bọ Cạp","♏","23/10 – 21/11","Nước","Kiên định","Sao Diêm Vương","Sâu sắc, kiên cường, trực giác tốt. Có thể kín đáo và khó buông chuyện cũ.","Yêu mãnh liệt, cần sự chân thành và tin tưởng tuyệt đối.","Hợp nghiên cứu, tâm lí, điều tra, hoạch định chiến lược."],
["Nhân Mã","♐","22/11 – 21/12","Lửa","Linh hoạt","Sao Mộc","Lạc quan, thích khám phá và tự do. Có thể thiếu kiên nhẫn với ràng buộc.","Cần người đồng hành cùng khám phá và trưởng thành.","Hợp du lịch, giáo dục, xuất bản, kinh doanh quốc tế."],
["Ma Kết","♑","22/12 – 19/1","Đất","Tiên phong","Sao Thổ","Kỉ luật, có trách nhiệm, kiên trì theo đuổi mục tiêu. Dễ khắt khe và quá nghiêm túc.","Chậm nhưng nghiêm túc, xây dựng mối quan hệ lâu dài.","Hợp quản lí, tài chính, kĩ thuật, công việc dài hạn."],
["Bảo Bình","♒","20/1 – 18/2","Khí","Kiên định","Sao Thiên Vương","Độc lập, sáng tạo, giàu lí tưởng. Có thể xa cách và khó đoán.","Cần không gian riêng và người hiểu mình.","Hợp công nghệ, khoa học, hoạt động xã hội."],
["Song Ngư","♓","19/2 – 20/3","Nước","Linh hoạt","Sao Hải Vương","Mơ mộng, giàu cảm xúc và trí tưởng tượng. Dễ cuốn theo cảm xúc, hay né tránh thực tế.","Dịu dàng, lãng mạn, dễ hi sinh vì người mình yêu.","Hợp nghệ thuật, âm nhạc, chăm sóc, tâm linh."]
];
const SIGN_START=[[120,10],[219,11],[321,0],[420,1],[521,2],[621,3],[723,4],[823,5],[923,6],[1023,7],[1122,8],[1222,9]];
function signOf(d,m){const v=m*100+d;let r=9;SIGN_START.forEach(([s,i])=>{if(v>=s)r=i});return r}
const CAN=["Giáp","Ất","Bính","Đinh","Mậu","Kỷ","Canh","Tân","Nhâm","Quý"];
const CHI=["Tý","Sửu","Dần","Mão","Thìn","Tỵ","Ngọ","Mùi","Thân","Dậu","Tuất","Hợi"];
const ANIMAL=[["🐭","Chuột","Thông minh, nhanh nhạy, khéo xoay xở. Hay lo xa."],["🐂","Trâu","Chăm chỉ, kiên nhẫn, đáng tin. Hơi bảo thủ."],["🐯","Hổ","Dũng cảm, có sức hút lãnh đạo. Hay nóng tính."],["🐱","Mèo","Nhẹ nhàng, tinh tế, yêu hòa bình. Ngại xung đột."],["🐲","Rồng","Tự tin, nhiều năng lượng và hoài bão. Dễ kiêu."],["🐍","Rắn","Điềm tĩnh, sâu sắc, giỏi quan sát. Hơi kín đáo."],["🐴","Ngựa","Yêu tự do, năng động, hoạt bát. Thiếu kiên nhẫn."],["🐐","Dê","Hiền hòa, nghệ sĩ, giàu cảm xúc. Hay do dự."],["🐵","Khỉ","Lanh lợi, hài hước, sáng tạo. Dễ thiếu tập trung."],["🐔","Gà","Chăm chỉ, ngăn nắp, thẳng tính. Hay cầu toàn."],["🐶","Chó","Trung thành, chính trực, đáng tin. Hay lo lắng."],["🐷","Heo","Chân thành, hào phóng, thích hưởng thụ. Dễ cả tin."]];
const NAPAM=[["Hải Trung Kim","Kim"],["Lư Trung Hỏa","Hỏa"],["Đại Lâm Mộc","Mộc"],["Lộ Bàng Thổ","Thổ"],["Kiếm Phong Kim","Kim"],["Sơn Đầu Hỏa","Hỏa"],["Giản Hạ Thủy","Thủy"],["Thành Đầu Thổ","Thổ"],["Bạch Lạp Kim","Kim"],["Dương Liễu Mộc","Mộc"],["Tuyền Trung Thủy","Thủy"],["Ốc Thượng Thổ","Thổ"],["Tích Lịch Hỏa","Hỏa"],["Tùng Bách Mộc","Mộc"],["Trường Lưu Thủy","Thủy"],["Sa Trung Kim","Kim"],["Sơn Hạ Hỏa","Hỏa"],["Bình Địa Mộc","Mộc"],["Bích Thượng Thổ","Thổ"],["Kim Bạch Kim","Kim"],["Phú Đăng Hỏa","Hỏa"],["Thiên Hà Thủy","Thủy"],["Đại Trạch Thổ","Thổ"],["Thoa Xuyến Kim","Kim"],["Tang Đố Mộc","Mộc"],["Đại Khê Thủy","Thủy"],["Sa Trung Thổ","Thổ"],["Thiên Thượng Hỏa","Hỏa"],["Thạch Lựu Mộc","Mộc"],["Đại Hải Thủy","Thủy"]];
const HANH={"Kim":["kiên định, quyết đoán, trọng nguyên tắc","trắng, xám, ánh kim; hợp thêm vàng, nâu (Thổ sinh Kim)"],"Mộc":["nhân hậu, ham học hỏi, luôn muốn phát triển","xanh lá; hợp thêm xanh dương, đen (Thủy sinh Mộc)"],"Thủy":["linh hoạt, thông minh, giàu cảm xúc","xanh dương, đen; hợp thêm trắng, xám (Kim sinh Thủy)"],"Hỏa":["nhiệt huyết, năng động, thích dẫn dắt","đỏ, cam, hồng, tím; hợp thêm xanh lá (Mộc sinh Hỏa)"],"Thổ":["vững vàng, đáng tin, bao dung","vàng, nâu; hợp thêm đỏ, cam (Hỏa sinh Thổ)"]};
const TAMHOP=[[8,0,4],[5,9,1],[2,6,10],[11,3,7]],LUCHOP=[[0,1],[2,11],[3,10],[4,9],[5,8],[6,7]],LUCXUNG=[[0,6],[1,7],[2,8],[3,9],[4,10],[5,11]];
const has=(arr,a,b)=>arr.some(p=>p.includes(a)&&p.includes(b));
function yearInfo(y){const i=((y-4)%60+60)%60,can=i%10,chi=i%12;return{can,chi,name:CAN[can]+" "+CHI[chi],np:NAPAM[Math.floor(i/2)]}}
function chiRel(a,b){
  if(a===b)return["Cùng tuổi","Hai bạn dễ đồng cảm vì giống nhau, nhưng cũng dễ cùng mắc một điểm yếu. Cần nhường nhịn và bổ sung cho nhau."];
  if(has(LUCHOP,a,b))return["Lục hợp","Quan hệ được xem là rất hòa hợp, dễ hỗ trợ và thấu hiểu nhau."];
  if(TAMHOP.some(g=>g.includes(a)&&g.includes(b)))return["Tam hợp","Quan hệ thuận lợi, dễ cùng chí hướng và đồng hành lâu dài."];
  if(has(LUCXUNG,a,b))return["Lục xung","Hai tính cách khá khác biệt, dễ va chạm. Cần nhiều lắng nghe và tôn trọng để hòa hợp."];
  return["Bình hòa","Không quá thuận cũng không quá khắc, mối quan hệ tốt hay không phụ thuộc vào sự thấu hiểu hằng ngày."];
}

function daily(si){
  const t=new Date(),seed=si*100000+t.getFullYear()*372+(t.getMonth()+1)*31+t.getDate(),r=rng(seed);
  const sc=AREAS.map(()=>1+Math.floor(r()*5)),avg=Math.round(sc.reduce((a,b)=>a+b,0)/4);
  const lines=AREAS.map((a,i)=>{const tier=sc[i]<=2?0:sc[i]===3?1:2;return"<div class='st'><b>"+a[0]+"</b> <span class='stars'>"+stars(sc[i])+"</span><br>"+esc(a[1][tier])+"</div>"}).join("");
  return{html:lines,avg,num:1+Math.floor(r()*99),color:COLORS[Math.floor(r()*COLORS.length)],gio:GIO[Math.floor(r()*12)],tip:TIPS[Math.floor(r()*TIPS.length)]};
}

function signCompat(i,j){
  const A=SIGNS[i][3],B=SIGNS[j][3],pair=[A,B].sort().join("+");
  let base,txt;
  if(A===B){base=84;txt="Cùng nguyên tố "+A+" nên rất dễ hiểu nhau và chung nhịp sống, nhưng cũng dễ cùng thổi phồng điểm yếu của nhau."}
  else if(pair==="Khí+Lửa"){base=88;txt="Lửa gặp Khí giúp nhau bùng lên: nhiều năng lượng, ý tưởng và niềm vui chung."}
  else if(pair==="Nước+Đất"){base=88;txt="Đất giữ cho Nước có bờ, Nước nuôi cho Đất tươi tốt: bổ trợ nhau về cảm xúc và sự thực tế."}
  else if(pair==="Lửa+Đất"){base=64;txt="Lửa nhanh và bốc, Đất chậm và chắc. Nếu tôn trọng nhịp của nhau, hai bạn bổ sung rất tốt."}
  else if(pair==="Khí+Nước"){base=62;txt="Khí thiên về lí trí, Nước thiên về cảm xúc. Cần trò chuyện thẳng thắn và kiên nhẫn để hiểu nhau."}
  else if(pair==="Lửa+Nước"){base=54;txt="Lửa và Nước rất khác tính. Có thể thu hút mạnh nhưng cần nhiều thấu hiểu để không làm nhau tổn thương."}
  else{base=57;txt="Đất thực tế, Khí thích tự do. Cần thỏa hiệp giữa sự ổn định và sự đổi mới."}
  if(Math.abs(i-j)===6)base+=4,txt+=" Hai cung đối nhau trên vòng hoàng đạo nên thường bị hút bởi chính điều mình thiếu.";
  return{score:Math.min(base,96),txt};
}

function parseDate(s){
  const m=s.trim().match(/^(\d{1,2})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{4})$/);if(!m)return null;
  const d=+m[1],mo=+m[2],y=+m[3],dt=new Date(y,mo-1,d);
  if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d||y<1900||y>new Date().getFullYear())return null;
  return{d,m:mo,y};
}

  const a=yearInfo(P.ly),b=yearInfo(y),r=chiRel(a.chi,b.chi);
  bot("<div class='t'>"+ANIMAL[a.chi][0]+" "+a.name+" + "+ANIMAL[b.chi][0]+" "+b.name+"</div><div class='st'><b>Quan hệ:</b> "+r[0]+"</div><div class='st'>"+esc(r[1])+"</div><div class='st'><b>Mệnh:</b> "+a.np[1]+" ("+a.np[0]+") và "+b.np[1]+" ("+b.np[0]+")</div><div class='mute'>Chỉ xét con giáp và mệnh theo quan niệm dân gian, mang tính giải trí.</div>");
  mode="free";qIn.placeholder="Gõ từ khóa: tarot, giải mộng, thần số...";sendBtn.textContent="Gửi";opts([["🤝 Xem cặp khác",compatYear],["↩ Menu",menu]]);
}
function dreamAsk(){mode="dream";qIn.placeholder="Bạn mơ thấy gì? (rắn, nước, bay...)";sendBtn.textContent="Giải";bot("Hãy gõ điều bạn mơ thấy (ví dụ: <i>rắn</i>, <i>nước</i>, <i>bay</i>, <i>rụng răng</i>, <i>bị đuổi</i>) hoặc chọn nhanh:");opts(DREAMS.map((d,i)=>[d[2].replace("Mơ thấy ","").replace("Mơ ",""),()=>showDream(i)]).concat([["↩ Menu",menu]]))}
function showDream(i){const d=DREAMS[i];bot("<div class='t'>"+esc(d[2])+"</div><div class='st'>"+esc(d[3])+"</div><div class='mute'>Theo quan niệm dân gian và gợi ý tâm lí, không phải dự báo chắc chắn.</div>");opts([["🌙 Giải mộng khác",dreamAsk],["↩ Menu",menu]])}
function doDream(t){
  const ws=norm(t).split(/[^a-z0-9]+/).filter(Boolean),hit=[];
  DREAMKW.forEach((kws,i)=>{if(kws.some(k=>k.length>1&&ws.indexOf(k)>=0))hit.push(i)});
  if(!hit.length){bot("Mình chưa có giải thích cho giấc mơ này. Bạn thử từ khóa khác hoặc chọn từ danh sách nhé.");dreamAsk();return}
  showDream(hit[0]);
}
function yesno(){
  const a=[["Có","Các dấu hiệu đang nghiêng về phía bạn. Hãy chuẩn bị kĩ rồi tiến lên."],["Nên","Đây là hướng đi khá thuận, miễn bạn giữ sự tỉnh táo."],["Chưa phải lúc","Hãy chờ thêm thông tin hoặc thời điểm tốt hơn."],["Không","Có thể nên chọn hướng khác hoặc thay đổi cách tiếp cận."],["Tùy cách bạn hành động","Kết quả phụ thuộc vào sự chuẩn bị và lựa chọn của chính bạn."]],r=pick(a);
  bot("<div class='t'>🔮 "+r[0]+"</div><div class='st'>"+esc(r[1])+"</div><div class='mute'>Câu trả lời ngẫu nhiên cho vui. Với việc quan trọng, hãy cân nhắc bằng thông tin thật và hỏi người có chuyên môn.</div>");
  opts([["🔮 Hỏi lại",yesno],["↩ Menu",menu]]);
}
function finishProfile(){
  P.ly=P.ly||P.y;P.si=signOf(P.d,P.m);
  const s=SIGNS[P.si],yi=yearInfo(P.ly);
  bot("Cảm ơn "+esc(P.name)+"! Bạn thuộc cung <b>"+s[1]+" "+s[0]+"</b>, tuổi <b>"+yi.name+" ("+ANIMAL[yi.chi][1]+")</b>, mệnh "+yi.np[1]+".");
  menu();
}
function onSearch(t){
  const w=norm(t),map=[["tarot|bai",tarotMenu],["hop cung",compatSign],["hop tuoi",compatYear],["cung|hoang dao",showSign],["van may|hom nay",showDaily],["tu vi|con giap|can chi|menh",tuvi],["than so|chu dao",numer],["mo|giai mong",dreamAsk],["co khong|yes|quyet dinh",yesno]];
  for(const [k,f] of map){if(k.split("|").some(x=>w.indexOf(x)>=0)){f();return}}
  bot("Mình chưa hiểu ý bạn. Bạn thử các từ khóa như <i>tarot</i>, <i>giải mộng</i>, <i>thần số</i>, <i>hợp tuổi</i> hoặc chọn từ menu nhé.");opts([["↩ Menu",menu]]);
}
$("bar").addEventListener("submit",e=>{
  e.preventDefault();const t=qIn.value.trim();if(!t)return;qIn.value="";user(t);
  if(mode==="name"){
    P={name:t.slice(0,30)};mode="dob";qIn.placeholder="Ngày sinh dạng 25/12/2005";sendBtn.textContent="Gửi";
    bot("Chào <b>"+esc(P.name)+"</b>! Hãy nhập <b>ngày sinh dương lịch</b> của bạn theo dạng <b>ngày/tháng/năm</b> (ví dụ 25/12/2005).");
  }else if(mode==="dob"){
    const d=parseDate(t);
    if(!d){bot("Mình chưa đọc được ngày sinh đó. Bạn nhập lại theo dạng <b>25/12/2005</b> nhé.");return}
    Object.assign(P,d);
    if(d.m<=2){
      mode="wait";
      bot("Bạn sinh vào tháng "+d.m+", có thể trước hoặc sau Tết Nguyên Đán (Tết rơi vào khoảng 21/1 đến 20/2 dương lịch). Bạn sinh <b>trước</b> hay <b>sau</b> Tết năm đó?");
      opts([["Trước Tết",()=>{P.ly=P.y-1;finishProfile()}],["Sau Tết",()=>{P.ly=P.y;finishProfile()}]]);
    }else finishProfile();
  }else if(mode==="year2"){
    if(!/^\d{4}$/.test(t)||+t<1900||+t>new Date().getFullYear()){bot("Hãy nhập năm sinh gồm 4 chữ số, ví dụ 2003.");return}
    doYear(+t);
  }else if(mode==="dream")doDream(t);
  else if(mode==="free")onSearch(t);
});
homeBtn.onclick=()=>{if(P&&P.si!==undefined){user("↩ Menu");menu()}};
bot("Xin chào! Chào mừng bạn đến với Huyền Bí Bot 🔮. Mình có thể xem cung hoàng đạo, rút bài Tarot, xem tử vi theo tuổi, thần số học, hợp tuổi và giải mộng. Vui lòng nhập tên của bạn để bắt đầu nhé!");
</script>
</body>
</html>
